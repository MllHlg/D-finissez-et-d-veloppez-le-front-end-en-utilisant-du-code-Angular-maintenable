<h2>Olympic games app</h2>
<hr/>
<div class="main-container">
  <app-header 
    *ngIf="header$ | async as headerData; 
    else loading" [headerInfos]="headerData">
  </app-header>
  <ng-template #loading>
    <p>Loading data...</p> 
  </ng-template>
  <div class="chart-wrapper">
    <canvas id="DashboardPieChart" aria-label="Graphique du nombdre de médailles par pays"></canvas>
  </div>
</div>
